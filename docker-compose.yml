name: ohmyfally

# Our containers join Zetaris's external network so Zetaris can reach them by name.
# Start Zetaris first (it creates `zetaris_default`), then: docker compose up -d
services:
  pi-postgres:
    image: postgres:16-alpine
    container_name: pi-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: gebiz
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d gebiz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zetaris_default]

  pi-s3:
    image: chrislusf/seaweedfs:3.80
    container_name: pi-s3
    command: server -s3 -dir=/data
    ports:
      - "127.0.0.1:18333:8333"
    volumes:
      - pi_s3data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [zetaris_default]

  # H-MEM memory service (TypeScript, adapted from the Meterless reference). See docs/agents/CONTRACTS.md section 6.
  # Building the image runs the official conformance suite; state/ persists in a named volume,
  # and the trust ledger is mirrored to ./logs/hmem-ledger.jsonl.
  pi-hmem:
    build:
      context: ./services
      dockerfile: hmem/Dockerfile
    container_name: pi-hmem
    ports:
      - "127.0.0.1:7070:7070"
    volumes:
      - pi_hmem_state:/data/state
      - ./logs:/data/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7070/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [zetaris_default]

  # The app itself: API on 8000, web UI on 3100. Profile "app" keeps these out of a plain `docker compose up`,
  # so they never need the Zetaris network: run `docker compose up --build api web`.
  # No .env (or no keys in it): offline sample mode on recorded data. With keys: live, reaching Zetaris,
  # Nightshift and H-MEM on the host through host.docker.internal.
  api:
    build: .
    profiles: ["app"]
    env_file:
      - path: .env
        required: false
    environment:
      SAMPLE_MODE: ${SAMPLE_MODE:-true}
      ZETARIS_REST_URL: ${DOCKER_ZETARIS_REST_URL:-http://host.docker.internal:8888/api/v1.0}
      METERLESS_BASE_URL: ${DOCKER_METERLESS_BASE_URL:-http://host.docker.internal:8088/v1}
      HMEM_URL: ${DOCKER_HMEM_URL:-http://host.docker.internal:7070}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3100},http://127.0.0.1:${WEB_PORT:-3100}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./logs:/app/logs

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-8000}
    profiles: ["app"]
    environment:
      HMEM_URL: ${DOCKER_HMEM_URL:-http://host.docker.internal:7070}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3100}:3100"
    depends_on: [api]

volumes:
  pi_pgdata:
  pi_s3data:
  pi_hmem_state:

networks:
  zetaris_default:
    external: true
