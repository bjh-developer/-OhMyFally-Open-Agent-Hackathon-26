name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          # JDBC only matches credential-free URLs here (passwords are ${POSTGRES_PASSWORD} placeholders filled from .env).
          extra_args: --results=verified,unknown --exclude-detectors=JDBC

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Live tests need Zetaris, Nightshift and H-MEM on the developer's machine; CI runs the rest.
      - run: pytest -m "not live" -q
        env:
          SAMPLE_MODE: "true"
